<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>memories</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="page">

    <div class="container">

        <div class="card">


            <!-- HEADER -->

            <p class="subtitle">
                a little archive of you
            </p>

            <h1 class="title">
                memories
            </h1>

            <p class="text center">
                from an online friendship that somehow
                became a real-life memory too.
            </p>


            <!-- ============================= -->
            <!-- SHA -->
            <!-- ============================= -->

            <h2 class="small-title">
                little memories of you
            </h2>


            <div class="photo-grid">


                <div class="photo-card">
                    <img
                        src="{{ url_for('static', filename='images/sha1.jpg') }}"
                        alt="sha 1"
                    >
                </div>


                <div class="photo-card">
                    <img
                        src="{{ url_for('static', filename='images/sha2.jpg') }}"
                        alt="sha 2"
                    >
                </div>


                <div class="photo-card">
                    <img
                        src="{{ url_for('static', filename='images/sha3.jpg') }}"
                        alt="sha 3"
                    >
                </div>


                <div class="photo-card">
                    <img
                        src="{{ url_for('static', filename='images/sha4.jpg') }}"
                        alt="sha 4"
                    >
                </div>


            </div>


            <!-- ============================= -->
            <!-- FAVORITE PEOPLE -->
            <!-- ============================= -->

            <h2
                class="small-title"
                style="margin-top:50px;"
            >
                your favorite people
            </h2>


            <div class="people">


                <!-- HEESEUNG -->

                <div class="person">

                    <img
                        src="{{ url_for('static', filename='images/heeseung.jpg') }}"
                        alt="heeseung"
                    >

                    <p class="person-name">
                        heeseung
                    </p>

                </div>


                <!-- SUNOO -->

                <div class="person">

                    <img
                        src="{{ url_for('static', filename='images/sunoo.jpg') }}"
                        alt="sunoo"
                    >

                    <p class="person-name">
                        sunoo
                    </p>

                </div>


                <!-- HEESUN 1 -->

                <div class="person">

                    <img
                        src="{{ url_for('static', filename='images/heesun1.jpg') }}"
                        alt="heesun"
                    >

                    <p class="person-name">
                        heesun
                    </p>

                </div>


                <!-- HEESUN 2 -->

                <div class="person">

                    <img
                        src="{{ url_for('static', filename='images/heesun2.jpg') }}"
                        alt="heesun"
                    >

                    <p class="person-name">
                        heesun
                    </p>

                </div>


            </div>


            <!-- ============================= -->
            <!-- BLOOD SAGA -->
            <!-- ============================= -->

            <h2
                class="small-title"
                style="margin-top:50px;"
            >
                something you love
            </h2>


            <div class="feature-card">

                <img
                    src="{{ url_for('static', filename='images/bloodsaga.jpg') }}"
                    alt="blood saga"
                    class="feature-image"
                >

            </div>


            <!-- ============================= -->
            <!-- ENDING -->
            <!-- ============================= -->

            <p class="text center">
                and hopefully, this won't be the last
                memory we make together.
            </p>


            <div class="center">

                <a
                    href="{{ url_for('message') }}"
                    class="button"
                >
                    next
                </a>

            </div>


        </div>

    </div>

</div>

</body>

</html>
